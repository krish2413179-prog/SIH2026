version: "3.9"

# ─────────────────────────────────────────────────────────────
#  Blockchain VASP Attribution Engine — Docker Compose
# ─────────────────────────────────────────────────────────────

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
  DEBUG: ${DEBUG:-false}
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/vasp_engine
  DATABASE_SYNC_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/vasp_engine
  DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY must be set}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_HOURS: ${JWT_ACCESS_TOKEN_EXPIRE_HOURS:-8}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  JWT_KEY_ROTATION_DAYS: ${JWT_KEY_ROTATION_DAYS:-90}
  ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
  BSCSCAN_API_KEY: ${BSCSCAN_API_KEY:-}
  POLYGONSCAN_API_KEY: ${POLYGONSCAN_API_KEY:-}
  SOLSCAN_API_KEY: ${SOLSCAN_API_KEY:-}
  BLOCKCHAIN_CACHE_TTL: ${BLOCKCHAIN_CACHE_TTL:-1800}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vasp-engine-reports}
  S3_REGION: ${S3_REGION:-us-east-1}
  SAHYOG_ENDPOINT_URL: ${SAHYOG_ENDPOINT_URL:-}
  SAHYOG_AUTH_TYPE: ${SAHYOG_AUTH_TYPE:-api_key}
  SAHYOG_API_KEY: ${SAHYOG_API_KEY:-}
  AUDIT_MAX_SIZE_BYTES: ${AUDIT_MAX_SIZE_BYTES:-10737418240}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
  TRACE_QUEUE_DEPTH_LIMIT: ${TRACE_QUEUE_DEPTH_LIMIT:-100}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  # ───────────────── PostgreSQL 15 ─────────────────
  db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: vasp_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vasp_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  # ───────────────── Redis 7 ─────────────────
  redis:
    image: redis:7.2.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ───────────────── FastAPI — API Server ─────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    ports:
      - "8000:8000"
    command: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 4
      --bind 0.0.0.0:8000
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

  # ───────────────── Celery Worker ─────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=8
      --queues=traces,reports,sahyog
      --hostname=worker@%h
    networks:
      - backend

  # ───────────────── Celery Beat (scheduler) ─────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - celery_beat_data:/app/celerybeat
    command: >
      celery -A app.tasks.celery_app beat
      --loglevel=info
      --schedule=/app/celerybeat/celerybeat-schedule
    networks:
      - backend

  # ───────────────── Next.js Frontend ─────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
    depends_on:
      - api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend

  # ───────────────── Nginx Reverse Proxy ─────────────────
  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - backend

  # ───────────────── MinIO (S3-compatible object storage) ─────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  celery_beat_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
