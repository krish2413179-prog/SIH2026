services:
  # -------------------------------------------------
  # 1️⃣ FastAPI backend + Celery Worker (Combined Web Service - Free Tier)
  # -------------------------------------------------
  - type: web
    name: vasp-backend
    env: python          # Render will use a Python virtualenv
    buildCommand: |
      pip install --upgrade pip
      pip install .
    # Runs Celery worker in background + Uvicorn web server in single service
    startCommand: bash ./start.sh
    envVars:
      # ── Application ───────────────────────────────────────
      APP_ENV: development               # or production / staging
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      DEBUG: false

      # ── Database (Supabase) ─────────────────────────────
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SYNC_URL: ${DATABASE_SYNC_URL}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY}

      # ── Redis / Celery (Upstash) ───────────────────────
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}

      # ── JWT ───────────────────────────────────────────────
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: 8
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
      JWT_KEY_ROTATION_DAYS: 90

      # ── Blockchain API Keys ─────────────────────────────
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY}
      BSCSCAN_API_KEY: ${BSCSCAN_API_KEY}
      POLYGONSCAN_API_KEY: ${POLYGONSCAN_API_KEY}
      SOLSCAN_API_KEY: ${SOLSCAN_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}   # optional, can be empty

      # ── Caching & Misc ─────────────────────────────────
      BLOCKCHAIN_CACHE_TTL: 1800
      RATE_LIMIT_PER_MINUTE: 100
      TRACE_QUEUE_DEPTH_LIMIT: 100

      # ── CORS (comma‑separated origins) ───────────────────
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,https://your-production-domain.com

      # ── Object Storage (MinIO) – keep defaults if unused ─
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: vasp-engine-reports
      S3_REGION: us-east-1

      # ── SAHYOG Portal (optional) ───────────────────────
      SAHYOG_ENDPOINT_URL: https://sahyog.gov.in/api
      SAHYOG_AUTH_TYPE: api_key
      SAHYOG_API_KEY: ${SAHYOG_API_KEY}

    preDeployCommand: |
      alembic upgrade head
