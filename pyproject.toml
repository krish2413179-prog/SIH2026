[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-vasp-attribution-engine"
version = "0.1.0"
description = "Blockchain Intelligence & VASP Attribution Engine for LEA investigations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.10",

    # Async task queue
    "celery==5.4.0",
    "redis==5.0.4",
    "kombu==5.3.7",

    # Auth & security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    "python-jose[cryptography]==3.3.0",

    # Data validation
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "email-validator==2.1.1",

    # HTTP client
    "httpx==0.27.0",

    # Graph analytics
    "networkx==3.3",

    # Report generation
    "weasyprint==62.3",
    "jinja2==3.1.4",

    # Rate limiting
    "slowapi==0.1.9",

    # Scheduling
    "apscheduler",

    # Object storage
    "boto3",
    "aioboto3",

    # Utilities
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "structlog==24.1.0",
    "numpy",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "anyio==4.3.0",

    # Property-based testing
    "hypothesis==6.100.1",

    # Mocking
    "respx==0.21.1",
    "fakeredis==2.23.1",

    # Type checking
    "mypy==1.10.0",
    "types-passlib==1.7.7.20240327",
    "types-redis==4.6.0.20240425",

    # Linting
    "ruff==0.4.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
